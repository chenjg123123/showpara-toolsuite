<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="FastTranslate">
  <title>FastTranslate Logo</title>
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ft-stroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ft-arr1" x1="14" y1="16" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ft-arr2" x1="16" y1="36" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ft-flash" x1="24" y1="18" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ft-bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="url(#ft-stroke)" stroke-width="1.5"/>
  <!-- Top Forward Arrow (A -> B Conversion) -->
  <path d="M16 20H40M40 20L32 13M40 20L32 27" stroke="url(#ft-arr1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ft-glow)"/>
  <!-- Bottom Reverse Arrow (B -> A Conversion) -->
  <path d="M48 44H24M24 44L32 37M24 44L32 51" stroke="url(#ft-arr2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ft-glow)"/>
  <!-- Center Lightning Bolt (Fast Speed ⚡) -->
  <path d="M35 24L26 34H33L29 42L40 31H32L35 24Z" fill="url(#ft-flash)"/>
</svg>
